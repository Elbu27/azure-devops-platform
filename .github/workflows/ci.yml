name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/container-api/requirements-dev.txt
      - run: pip install -r projects/container-api/requirements-dev.txt
      - run: ruff check projects/container-api
      - run: ruff format --check projects/container-api
      - run: PYTHONPATH=projects/container-api pytest -q projects/container-api/tests

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [projects/azure-platform, projects/observability]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=${{ matrix.directory }} fmt -check -recursive
      - run: terraform -chdir=${{ matrix.directory }} init -backend=false
      - run: terraform -chdir=${{ matrix.directory }} validate

  security-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline "**/*.md"
          fail: true
