name: Deploy API to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: cloud-status-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build immutable image in ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            projects/container-api
      - name: Record current revision
        id: previous
        run: |
          revision=$(az containerapp revision list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query "sort_by([?properties.active], &properties.createdTime)[-1].name" -o tsv)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Configure registry identity and deploy
        run: |
          az containerapp registry set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --server "${{ vars.AZURE_ACR_NAME }}.azurecr.io" \
            --identity "${{ vars.AZURE_MANAGED_IDENTITY_ID }}"
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}" \
            --revision-suffix "sha-${GITHUB_SHA:0:7}"
          az containerapp ingress update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --target-port 8080
          az containerapp ingress traffic set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --revision-weight latest=100
      - name: Smoke test or roll back traffic
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          fqdn=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if ! curl --fail --retry 8 --retry-delay 10 "https://${fqdn}/healthz"; then
            if [[ -n "$PREVIOUS_REVISION" ]]; then
              az containerapp ingress traffic set \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --revision-weight "$PREVIOUS_REVISION=100"
            fi
            exit 1
          fi
